name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # TODO: make high-severity audit advisories blocking after transitive findings are triaged.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # TODO: make this blocking once the repository has been formatted.
      - name: Check formatting drift
        continue-on-error: true
        run: npm run format:check

      - name: Validate maps
        run: npm run map:validate

      - name: Validate agent workflows
        run: npm run agent:validate

      - name: Validate shadow architecture
        run: npm run shadow:validate

      - name: Run tests
        run: npm test

      - name: Run coverage thresholds
        run: npm run test:coverage

      - name: Type-check & build
        run: npm run build

      - name: Verify build purity
        run: |
          if ! git diff --exit-code; then
            echo "::error::Build changed tracked files. Generated assets or manifests must be deterministic; commit generated output or fix the build pipeline."
            exit 1
          fi

      - name: Check bundle size budgets
        run: bash scripts/check-bundle-size.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
