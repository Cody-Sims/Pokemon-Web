name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '24 10 * * *'

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # TODO: make high-severity audit advisories blocking after transitive findings are triaged.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # TODO: make this blocking once the repository has been formatted.
      - name: Check formatting drift
        continue-on-error: true
        run: npm run format:check

      - name: Validate maps
        run: npm run map:validate

      - name: Validate agent workflows
        run: npm run agent:validate

      - name: Validate shadow architecture
        run: npm run shadow:validate

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run coverage thresholds
        run: npm run test:coverage

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Verify build purity
        run: |
          if ! git diff --exit-code; then
            echo "::error::Build changed tracked files. Generated assets or manifests must be deterministic; commit generated output or fix the build pipeline."
            exit 1
          fi

      - name: Check bundle size budgets
        run: bash scripts/check-bundle-size.sh

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Only the specs that have a track record of passing in CI gate a PR.
        # mobile-ui, ui-regression, boot-to-title, menu-navigation and
        # new-game-flow have never run in CI and are known to hang on browser
        # context teardown; they run in the nightly job until they are stable.
        run: |
          npm run test:e2e:smoke
          npm run test:visual
          npm run test:perf

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run deterministic fuzz suite
        run: npm run test:fuzz

      - name: Run the full E2E suite
        # Not yet PR-gating: these specs hang on browser context teardown.
        # Tracked in docs/bugs.md.
        continue-on-error: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-playwright-report
          path: tests/playwright-report/
          retention-days: 14
